name: CI

on:
  push:
    branches:
      - main
      - 'v[0-9]+.[0-9][0-9]'
  pull_request:
    branches:
      - main
      - 'v[0-9]+.[0-9][0-9]'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
